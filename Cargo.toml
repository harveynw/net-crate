[package]
name = "net"
version = "0.1.0"
edition = "2024"

[lib]
name = "net"
path = "src/lib.rs"

[[bin]]
name = "example"
path = "src/main.rs"

[workspace]
members = []
exclude = ["clients/game/backend"]

[dependencies]
# Logging
env_logger = "0.11.8"
log = "0.4.27"

# Async
tokio = { version = "1.44.1", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = "0.3.31"

# Network protocols
tokio-tungstenite = "0.26.2"
webrtc = { git = "https://github.com/webrtc-rs/webrtc", rev = "f6b017b0b8f3ed3e47b920b563620800898cfaf0" }
async-trait = "0.1.89"
bytes = "1.10.1"
serde_json = "1.0.140"
serde = "1.0.219"
